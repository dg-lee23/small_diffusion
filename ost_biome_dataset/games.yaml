# 카테고리별 추천 게임 초안 (PLAN.md 2절 참고)
#
# wiki_api: 해당 게임 위키의 MediaWiki API 엔드포인트 (도메인은 확인된 것,
#           정확한 존재 여부/문서 제목은 wiki_scraper.py의 search_music_pages()로
#           런타임에 검색해서 확인할 것 — 이 세션에서는 네트워크 egress가 막혀 있어
#           문서 제목까지 직접 검증하지 못했다.
# zone_is_biome: true  -> 위키가 이미 바이옴 단위로 트랙을 정리해줌 (수작업 거의 불필요)
#                false -> 지역명(zone)만 있어 zone -> biome 매핑표를 직접 작성해야 함
# priority: 1(먼저 채우기 쉬움) ~ 3(나중, 도전적)

categories:
  forest_jungle:
    label_ko: "숲 / 정글"
    priority: 1
    games:
      - name: "Ori and the Blind Forest"
        wiki_api: "https://ori.fandom.com/api.php"
        zone_is_biome: true
        notes: "게임 전체가 숲 단일 바이옴. 필터링 불필요."
      - name: "Hollow Knight"
        wiki_api: "https://hollowknight.fandom.com/api.php"
        zone_is_biome: false
        notes: "Greenpath 등 일부 지역만 숲/정글에 해당. zone_map 필요."
      - name: "World of Warcraft"
        wiki_api: "https://wowpedia.fandom.com/api.php"
        zone_is_biome: false
        notes: "20년치 존 음악. 물량은 충분히 크나 zone_map 작업 필요."
      - name: "Final Fantasy XIV"
        wiki_api: "https://ffxiv.consolegameswiki.com/api.php"
        zone_is_biome: false
      - name: "Genshin Impact"
        wiki_api: "https://genshin-impact.fandom.com/api.php"
        zone_is_biome: false
        notes: "리월/수미르 삼림 지역만 필터링."
      - name: "Xenoblade Chronicles"
        wiki_api: "https://xenoblade.fandom.com/api.php"
        zone_is_biome: false
        notes: "Gaur Plain, Makna Forest 등 zone명이 곧 바이옴에 가까움."
      - name: "Monster Hunter"
        wiki_api: "https://monsterhunter.fandom.com/api.php"
        zone_is_biome: false
      - name: "Pokemon"
        wiki_api: "https://bulbapedia.bulbagarden.net/api.php"
        zone_is_biome: false

  snow_ice:
    label_ko: "설원 / 얼음산"
    priority: 1
    games:
      - name: "Celeste"
        wiki_api: "https://celestegame.fandom.com/api.php"
        zone_is_biome: true
        notes: "설산 등반이 게임 전체 배경."
      - name: "World of Warcraft"
        wiki_api: "https://wowpedia.fandom.com/api.php"
        zone_is_biome: false
      - name: "Final Fantasy XIV"
        wiki_api: "https://ffxiv.consolegameswiki.com/api.php"
        zone_is_biome: false
        notes: "Coerthas 등."
      - name: "Genshin Impact"
        wiki_api: "https://genshin-impact.fandom.com/api.php"
        zone_is_biome: false
        notes: "드래곤스파인, 폰타인 설원 등."
      - name: "Monster Hunter"
        wiki_api: "https://monsterhunter.fandom.com/api.php"
        zone_is_biome: false
      - name: "Xenoblade Chronicles"
        wiki_api: "https://xenoblade.fandom.com/api.php"
        zone_is_biome: false
        notes: "Valak Mountain."
      - name: "Pokemon"
        wiki_api: "https://bulbapedia.bulbagarden.net/api.php"
        zone_is_biome: false

  desert_rock:
    label_ko: "사막 / 바위산"
    priority: 1
    games:
      - name: "Journey"
        wiki_api: null
        zone_is_biome: true
        notes: "위키 정리 수준이 낮아 수작업 스크래핑은 비권장, 수동 수집 후보."
      - name: "The Legend of Zelda: Breath of the Wild / Tears of the Kingdom"
        wiki_api: "https://zelda.fandom.com/api.php"
        zone_is_biome: false
        notes: "게루도 사막 지역."
      - name: "World of Warcraft"
        wiki_api: "https://wowpedia.fandom.com/api.php"
        zone_is_biome: false
        notes: "Tanaris, Silithus, Badlands 등."
      - name: "Final Fantasy XIV"
        wiki_api: "https://ffxiv.consolegameswiki.com/api.php"
        zone_is_biome: false
        notes: "Thanalan."
      - name: "Genshin Impact"
        wiki_api: "https://genshin-impact.fandom.com/api.php"
        zone_is_biome: false
        notes: "수미르 사막."
      - name: "Monster Hunter"
        wiki_api: "https://monsterhunter.fandom.com/api.php"
        zone_is_biome: false
        notes: "Sandy Plains, Wildspire Waste."

  cave_underground:
    label_ko: "동굴 / 지하 / 폐광"
    priority: 1
    games:
      - name: "Terraria"
        wiki_api: "https://terraria.wiki.gg/api.php"
        zone_is_biome: true
        notes: "Music 문서가 문자 그대로 바이옴별 표로 정리되어 있음. 최우선 대상."
      - name: "Hollow Knight"
        wiki_api: "https://hollowknight.fandom.com/api.php"
        zone_is_biome: false
        notes: "Crystal Peak, Deepnest, Fungal Wastes 등 대부분이 지하."
      - name: "Metroid Prime"
        wiki_api: "https://metroid.fandom.com/api.php"
        zone_is_biome: false
        notes: "Phazon Mines 등."
      - name: "World of Warcraft"
        wiki_api: "https://wowpedia.fandom.com/api.php"
        zone_is_biome: false
        notes: "던전/인스턴스 음악."

  sea_underwater:
    label_ko: "바다 / 항구 / 수중 / 심해"
    priority: 2
    games:
      - name: "Subnautica"
        wiki_api: "https://subnautica.fandom.com/api.php"
        zone_is_biome: true
        notes: "바이옴별 앰비언트 트랙이 거의 1:1로 정리됨. 최우선 대상."
      - name: "The Legend of Zelda: The Wind Waker"
        wiki_api: "https://zelda.fandom.com/api.php"
        zone_is_biome: true
        notes: "게임 전체가 바다 배경."
      - name: "World of Warcraft"
        wiki_api: "https://wowpedia.fandom.com/api.php"
        zone_is_biome: false
        notes: "Vashj'ir(전체 수중 존), Azshara 해안 등."
      - name: "Final Fantasy XIV"
        wiki_api: "https://ffxiv.consolegameswiki.com/api.php"
        zone_is_biome: false
      - name: "Genshin Impact"
        wiki_api: "https://genshin-impact.fandom.com/api.php"
        zone_is_biome: false
        notes: "폰타인(수중 도시)."

  city_machine:
    label_ko: "현대도시 / 기계"
    priority: 3
    games:
      - name: "Mirror's Edge"
        wiki_api: "https://mirrorsedge.fandom.com/api.php"
        zone_is_biome: true
      - name: "Persona 5"
        wiki_api: "https://megamitensei.fandom.com/api.php"
        zone_is_biome: false
        notes: "도쿄 배경 구역 다수."
      - name: "NieR:Automata"
        wiki_api: "https://nier.fandom.com/api.php"
        zone_is_biome: false
        notes: "폐허 도시/기계 시설 구역."
      - name: "Final Fantasy VII Remake"
        wiki_api: "https://finalfantasy.fandom.com/api.php"
        zone_is_biome: true
        notes: "미드가르 = 기계도시 배경 전체."
      - name: "World of Warcraft"
        wiki_api: "https://wowpedia.fandom.com/api.php"
        zone_is_biome: false
        notes: "스톰윈드(도시), 노움리건(기계) 등 일부 존만 해당."
    caveat: >
      다른 5개 카테고리와 달리 자연 바이옴이 아니라 인공 테마라 후보 게임 자체가 적음.
      100곡 목표는 가장 늦게, 가장 낮은 우선순위로 채울 것을 권장 (PLAN.md 4절 참고).
